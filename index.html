<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b13">
    <title>Trace -- Computational Studio October 2026</title>
    <link rel="stylesheet" href="source/style.css">
</head>
<body>
    <main class="app">
        <section class="tracking-view" aria-label="Full-screen artwork and mouse tracking view">
            <canvas id="artwork" aria-label="Generated abstract wallpaper"></canvas>
        </section>

        <section class="controls" aria-label="Artwork controls">
            <button class="drag-handle" id="dragHandle" type="button" aria-label="Drag to move controls" title="Drag to move controls">⠿</button>
            <button class="minimize-button" id="minimizeButton" type="button" aria-label="Minimize controls" title="Minimize controls">−</button>
            <div class="brand">
                <span class="eyebrow">Computational Studio October 2026</span>
                <h1>Trace / <span class="brand-version" id="traceNumber">01</span></h1>
                <p>Move naturally. Leave a little of yourself in the image.</p>
            </div>

            <div class="session" id="sessionPanel">
                <div class="session-heading">
                    <div>
                        <div class="section-label">Tracking session</div>
                        <div class="session-state" aria-live="polite">
                            <span class="state-dot" aria-hidden="true"></span>
                            <span id="sessionState">Ready when you are</span>
                        </div>
                    </div>
                    <output class="timer" id="timer" aria-label="Time remaining">00:20</output>
                </div>
                <div
                    class="progress-track"
                    id="progressTrack"
                    role="progressbar"
                    aria-label="Capture progress"
                    aria-valuemin="0"
                    aria-valuemax="20"
                    aria-valuenow="0">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="actions">
                <button class="primary" id="startButton" type="button">Start capture</button>
                <button id="stopButton" type="button" disabled>
                    <div class="stop-prompt" id="stopPrompt">
                        <span id="stopButtonLabel">Stop &amp; create art</span>
                        <div class="countdown-number" id="primingCount" hidden></div>
                        <span id="stopButtonHint" hidden></span>
                    </div>
                </button>
                <button id="downloadButton" type="button">Download wallpaper</button>
                <button id="paletteButton" type="button">Change palette</button>

                <div class="palette-controls" aria-label="Palette adjustments">
                    <label class="palette-control">
                        <span class="palette-label">Hue <output id="hueValue">0°</output></span>
                        <input id="hueControl" type="range" min="0" max="359" value="0" aria-label="Hue shift">
                    </label>
                    <label class="palette-control">
                        <span class="palette-label">Saturation <output id="saturationValue">100%</output></span>
                        <input id="saturationControl" type="range" min="0" max="100" value="70" aria-label="Saturation level">
                    </label>
                    <label class="palette-control">
                        <span class="palette-label">Lightness <output id="lightnessValue">0</output></span>
                        <input id="lightnessControl" type="range" min="-30" max="30" value="0" aria-label="Lightness shift">
                    </label>
                </div>
                <p class="status" id="status" role="status" aria-live="polite">Your 4K canvas is ready. Capture 20 seconds of movement to begin.</p>
            </div>
        </section>
    </main>

    <script src="source/script.js" defer></script>
</body>
</html>
