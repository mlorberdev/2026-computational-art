<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b13">
    <title>Trace / A generative wallpaper studio</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #080b13;
            color: #f1f3fa;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            --muted: #9299ad;
            --panel: rgb(15 19 31 / 88%);
            --line: rgb(255 255 255 / 10%);
            --accent: #a99aff;
        }

        * { box-sizing: border-box; }

        html, body { min-width: 320px; min-height: 100%; margin: 0; }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 100%, rgb(66 45 116 / 17%), transparent 55%),
                #080b13;
        }

        .tracking-view {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #080b13;
        }

        #artwork {
            display: block;
            width: 100%;
            height: 100%;
        }

        .tracking-view::after {
            position: absolute;
            inset: 0;
            content: "";
            pointer-events: none;
            background: linear-gradient(180deg, rgb(5 7 12 / 25%), transparent 35%, rgb(5 7 12 / 12%));
        }

        .controls {
            position: sticky;
            z-index: 1;
            top: 18px;
            display: grid;
            grid-template-columns: minmax(190px, 1fr) auto;
            gap: 22px 30px;
            width: min(100% - 36px, 1080px);
            margin: 18px auto 0;
            padding: 22px 24px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 0 18px 60px rgb(0 0 0 / 34%);
            -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
        }

        .brand {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 7px;
        }

        .eyebrow, .section-label {
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .17em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(20px, 3vw, 27px);
            font-weight: 550;
            letter-spacing: -.055em;
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .session {
            display: flex;
            min-width: 260px;
            flex-direction: column;
            justify-content: center;
            gap: 9px;
        }

        .session-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .session-state {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #c5c9d5;
            font-size: 12px;
        }

        .state-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #737b8d;
            box-shadow: 0 0 12px rgb(115 123 141 / 40%);
        }

        .is-capturing .state-dot {
            background: #a99aff;
            box-shadow: 0 0 14px rgb(169 154 255 / 90%);
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse { 50% { opacity: .4; } }

        .timer {
            font-variant-numeric: tabular-nums;
            font-size: 24px;
            font-weight: 550;
            letter-spacing: -.04em;
        }

        .progress-track {
            height: 4px;
            overflow: hidden;
            border-radius: 99px;
            background: rgb(255 255 255 / 10%);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #a99aff, #6cdad0);
            transition: width .1s linear;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 9px;
            grid-column: 1 / -1;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        button {
            min-height: 40px;
            padding: 0 15px;
            border: 1px solid var(--line);
            border-radius: 9px;
            color: #e9eaf1;
            background: rgb(255 255 255 / 5%);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background .18s ease, border-color .18s ease, transform .18s ease;
        }

        button:hover:not(:disabled) {
            border-color: rgb(255 255 255 / 24%);
            background: rgb(255 255 255 / 10%);
        }

        button:active:not(:disabled) { transform: translateY(1px); }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        button:disabled { opacity: .42; cursor: not-allowed; }

        .primary {
            border-color: transparent;
            color: #151222;
            background: #b8adff;
        }

        .primary:hover:not(:disabled) {
            border-color: transparent;
            background: #d0c9ff;
        }

        .palette-controls {
            display: grid;
            grid-template-columns: repeat(3, minmax(90px, 1fr));
            gap: 14px;
            flex: 1 1 300px;
            margin-left: auto;
        }

        .palette-control {
            display: grid;
            gap: 6px;
        }

        .palette-label {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            color: var(--muted);
            font-size: 10px;
        }

        .palette-label output { color: #d9d8e7; font-variant-numeric: tabular-nums; }

        input[type="range"] {
            width: 100%;
            height: 14px;
            margin: 0;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .status {
            min-height: 16px;
            flex: 1 0 100%;
            margin: -2px 0 0;
            color: var(--muted);
            font-size: 11px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }

        @media (max-width: 640px) {
            .controls {
                grid-template-columns: 1fr auto;
                gap: 17px;
                width: calc(100% - 24px);
                margin-top: 12px;
                padding: 17px;
            }

            .session { min-width: 0; align-items: flex-end; }
            .session-heading { justify-content: flex-end; }
            .session-state { display: none; }
            .session .section-label { text-align: right; }
            .actions { gap: 8px; padding-top: 13px; }
            .actions button { flex: 1 1 42%; padding-inline: 9px; }
            .palette-controls { flex-basis: 100%; margin: 4px 0 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="tracking-view" aria-label="Full-screen artwork and mouse tracking view">
            <canvas id="artwork" aria-label="Generated abstract wallpaper"></canvas>
        </section>

        <section class="controls" aria-label="Artwork controls">
            <div class="brand">
                <span class="eyebrow">Generative wallpaper studio</span>
                <h1>Trace / <span style="color: var(--accent)">01</span></h1>
                <p>Move naturally. Leave a little of yourself in the image.</p>
            </div>

            <div class="session" id="sessionPanel">
                <div class="session-heading">
                    <div>
                        <div class="section-label">Tracking session</div>
                        <div class="session-state" aria-live="polite">
                            <span class="state-dot" aria-hidden="true"></span>
                            <span id="sessionState">Ready when you are</span>
                        </div>
                    </div>
                    <output class="timer" id="timer" aria-label="Time remaining">01:00</output>
                </div>
                <div
                    class="progress-track"
                    id="progressTrack"
                    role="progressbar"
                    aria-label="Capture progress"
                    aria-valuemin="0"
                    aria-valuemax="60"
                    aria-valuenow="0">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="actions">
                <button class="primary" id="startButton" type="button">Start capture</button>
                <button id="stopButton" type="button" disabled>Stop &amp; generate art</button>
                <button id="downloadButton" type="button">Download wallpaper</button>
                <button id="paletteButton" type="button">Change palette</button>

                <div class="palette-controls" aria-label="Palette adjustments">
                    <label class="palette-control">
                        <span class="palette-label">Hue <output id="hueValue">0°</output></span>
                        <input id="hueControl" type="range" min="0" max="359" value="0" aria-label="Hue shift">
                    </label>
                    <label class="palette-control">
                        <span class="palette-label">Saturation <output id="saturationValue">100%</output></span>
                        <input id="saturationControl" type="range" min="0" max="160" value="100" aria-label="Saturation level">
                    </label>
                    <label class="palette-control">
                        <span class="palette-label">Lightness <output id="lightnessValue">0</output></span>
                        <input id="lightnessControl" type="range" min="-30" max="30" value="0" aria-label="Lightness shift">
                    </label>
                </div>
                <p class="status" id="status" role="status" aria-live="polite">Your 4K canvas is ready. Capture a minute of movement to begin.</p>
            </div>
        </section>
    </main>

    <script>
        (() => {
            "use strict";

            const CAPTURE_DURATION = 60_000;
            const SAMPLE_INTERVAL = 100;
            const OUTPUT_WIDTH = 3840;
            const OUTPUT_HEIGHT = 2160;
            const canvas = document.getElementById("artwork");
            const context = canvas.getContext("2d", { alpha: false });
            const startButton = document.getElementById("startButton");
            const stopButton = document.getElementById("stopButton");
            const downloadButton = document.getElementById("downloadButton");
            const paletteButton = document.getElementById("paletteButton");
            const timer = document.getElementById("timer");
            const progressBar = document.getElementById("progressBar");
            const progressTrack = document.getElementById("progressTrack");
            const sessionPanel = document.getElementById("sessionPanel");
            const sessionState = document.getElementById("sessionState");
            const status = document.getElementById("status");
            const hueControl = document.getElementById("hueControl");
            const saturationControl = document.getElementById("saturationControl");
            const lightnessControl = document.getElementById("lightnessControl");
            const hueValue = document.getElementById("hueValue");
            const saturationValue = document.getElementById("saturationValue");
            const lightnessValue = document.getElementById("lightnessValue");

            if (!context) {
                status.textContent = "This browser could not create a 2D canvas context.";
                startButton.disabled = true;
                downloadButton.disabled = true;
                return;
            }

            canvas.width = OUTPUT_WIDTH;
            canvas.height = OUTPUT_HEIGHT;

            let trackingData = [];
            let capturing = false;
            let captureStartedAt = 0;
            let sampleTimer = null;
            let latestPosition = { x: 0.5, y: 0.5 };
            let palette = { hue: 0, saturation: 100, lightness: 0 };

            const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
            const wrapHue = value => ((value % 360) + 360) % 360;
            const setStatus = message => { status.textContent = message; };

            function colorFor(hue, saturation, lightness, alpha) {
                return `hsla(${wrapHue(hue)}, ${clamp(saturation, 0, 100)}%, ${clamp(lightness, 0, 100)}%, ${alpha})`;
            }

            function updateSession(elapsed = 0) {
                const remaining = Math.max(0, CAPTURE_DURATION - elapsed);
                const seconds = Math.ceil(remaining / 1000);
                timer.value = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
                timer.textContent = timer.value;
                const progress = clamp((elapsed / CAPTURE_DURATION) * 100, 0, 100);
                progressBar.style.width = `${progress}%`;
                progressTrack.setAttribute("aria-valuenow", String(Math.floor(progress * 60 / 100)));
            }

            function updatePaletteControls() {
                hueValue.value = `${palette.hue}°`;
                hueValue.textContent = hueValue.value;
                saturationValue.value = `${palette.saturation}%`;
                saturationValue.textContent = saturationValue.value;
                lightnessValue.value = String(palette.lightness);
                lightnessValue.textContent = lightnessValue.value;
            }

            function samplePosition() {
                trackingData.push({
                    x: clamp(latestPosition.x, 0, 1),
                    y: clamp(latestPosition.y, 0, 1),
                    time: performance.now() - captureStartedAt
                });
                drawPreviewPoint(trackingData[trackingData.length - 1], trackingData[trackingData.length - 2]);
            }

            function finishCapture(message) {
                if (!capturing) return;
                const elapsed = Math.min(CAPTURE_DURATION, performance.now() - captureStartedAt);
                capturing = false;
                window.clearInterval(sampleTimer);
                sampleTimer = null;
                sessionPanel.classList.remove("is-capturing");
                startButton.disabled = false;
                stopButton.disabled = true;
                sessionState.textContent = "Artwork generated";
                updateSession(elapsed);
                drawArtwork(trackingData, false);
                setStatus(`${trackingData.length} movement samples shaped your wallpaper. Adjust the palette or download the PNG.`);
                if (message) setStatus(message);
            }

            function beginCapture() {
                if (capturing) return;
                trackingData = [];
                captureStartedAt = performance.now();
                capturing = true;
                latestPosition = { x: 0.5, y: 0.5 };
                sessionPanel.classList.add("is-capturing");
                startButton.disabled = true;
                stopButton.disabled = false;
                sessionState.textContent = "Recording movement";
                updateSession(0);
                setStatus("Move your pointer anywhere in the window. A point is sampled every 100 ms.");
                drawBackground([]);
                sampleTimer = window.setInterval(() => {
                    samplePosition();
                    const elapsed = performance.now() - captureStartedAt;
                    updateSession(elapsed);
                    if (elapsed >= CAPTURE_DURATION) finishCapture();
                }, SAMPLE_INTERVAL);
            }

            function seededRandom(seed) {
                let value = seed >>> 0;
                return () => {
                    value = (value * 1664525 + 1013904223) >>> 0;
                    return value / 4294967296;
                };
            }

            function drawBackground(points) {
                const averageX = points.length
                    ? points.reduce((sum, point) => sum + point.x, 0) / points.length
                    : 0.5;
                const averageY = points.length
                    ? points.reduce((sum, point) => sum + point.y, 0) / points.length
                    : 0.5;
                const hue = wrapHue(averageX * 360 + palette.hue + 224);
                const saturation = clamp((28 + averageY * 34) * (palette.saturation / 100), 0, 100);
                const lightness = clamp(5 + palette.lightness * 0.22, 0, 100);
                context.globalCompositeOperation = "source-over";
                context.fillStyle = colorFor(hue, saturation, lightness, 1);
                context.fillRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);

                const glow = context.createRadialGradient(
                    OUTPUT_WIDTH * averageX, OUTPUT_HEIGHT * averageY, 0,
                    OUTPUT_WIDTH * averageX, OUTPUT_HEIGHT * averageY, OUTPUT_WIDTH * 0.72
                );
                glow.addColorStop(0, colorFor(hue + 36, saturation, lightness + 15, 0.38));
                glow.addColorStop(1, colorFor(hue - 35, saturation, lightness, 0));
                context.fillStyle = glow;
                context.fillRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);
            }

            function drawPreviewPoint(point, previous) {
                const x = point.x * OUTPUT_WIDTH;
                const y = point.y * OUTPUT_HEIGHT;
                const hue = point.x * 360 + palette.hue;
                const radius = OUTPUT_WIDTH * 0.012;

                context.save();
                context.globalCompositeOperation = "screen";
                if (previous) {
                    context.beginPath();
                    context.moveTo(previous.x * OUTPUT_WIDTH, previous.y * OUTPUT_HEIGHT);
                    context.lineTo(x, y);
                    context.strokeStyle = colorFor(hue, 78, 72 + palette.lightness, 0.45);
                    context.lineWidth = OUTPUT_WIDTH * 0.0015;
                    context.stroke();
                }
                const glow = context.createRadialGradient(x, y, 0, x, y, radius);
                glow.addColorStop(0, colorFor(hue, 80, 78 + palette.lightness, 0.6));
                glow.addColorStop(1, colorFor(hue + 38, 72, 55 + palette.lightness, 0));
                context.fillStyle = glow;
                context.beginPath();
                context.arc(x, y, radius, 0, Math.PI * 2);
                context.fill();
                context.restore();
            }

            function drawArtwork(points, preview) {
                drawBackground(points);
                if (!points.length) return;

                const random = seededRandom(points.length * 7919 + palette.hue * 31 + palette.saturation * 17 + palette.lightness * 13);
                const scale = OUTPUT_WIDTH / 1000;
                const centers = points.map(point => ({
                    x: point.x * OUTPUT_WIDTH,
                    y: point.y * OUTPUT_HEIGHT
                }));

                context.save();
                context.lineCap = "round";
                context.lineJoin = "round";

                if (centers.length > 1) {
                    context.globalCompositeOperation = "screen";
                    context.lineWidth = 2.2 * scale;
                    context.beginPath();
                    context.moveTo(centers[0].x, centers[0].y);
                    for (let i = 1; i < centers.length; i++) {
                        const previous = centers[i - 1];
                        const current = centers[i];
                        const wave = Math.sin(i * 0.31) * 32 * scale;
                        const middleX = (previous.x + current.x) / 2;
                        const middleY = (previous.y + current.y) / 2;
                        context.quadraticCurveTo(middleX + wave, middleY - wave, current.x, current.y);
                    }
                    const first = points[0];
                    context.strokeStyle = colorFor(first.x * 360 + palette.hue, 80, 70 + palette.lightness, preview ? 0.58 : 0.28);
                    context.stroke();
                }

                centers.forEach((center, index) => {
                    const point = points[index];
                    const hue = point.x * 360 + palette.hue + Math.sin(index * 0.09) * 24;
                    const saturation = clamp((38 + point.y * 58) * palette.saturation / 100, 0, 100);
                    const lightness = clamp(48 + Math.sin(index * 0.17) * 17 + palette.lightness, 4, 92);
                    const radius = (18 + random() * 43 + Math.abs(Math.sin(index * 0.13)) * 34) * scale;
                    const gradient = context.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius * 2.5);
                    gradient.addColorStop(0, colorFor(hue, saturation, lightness + 12, preview ? 0.62 : 0.34));
                    gradient.addColorStop(0.35, colorFor(hue + 35, saturation, lightness, preview ? 0.25 : 0.14));
                    gradient.addColorStop(1, colorFor(hue - 32, saturation, lightness, 0));
                    context.globalCompositeOperation = index % 5 === 0 ? "multiply" : "screen";
                    context.fillStyle = gradient;
                    context.beginPath();
                    context.arc(center.x, center.y, radius * 2.5, 0, Math.PI * 2);
                    context.fill();

                    const wobbleX = (random() - 0.5) * radius * 1.25;
                    const wobbleY = (random() - 0.5) * radius * 1.25;
                    const phase = index * 0.23;
                    context.globalCompositeOperation = index % 3 === 0 ? "overlay" : "screen";
                    context.fillStyle = colorFor(hue + 65, saturation * 0.88, lightness + 10, preview ? 0.12 : 0.075);
                    context.beginPath();
                    context.moveTo(center.x + wobbleX, center.y - radius);
                    context.bezierCurveTo(
                        center.x + radius * Math.cos(phase), center.y - radius * 0.2,
                        center.x + radius * 0.3, center.y + radius * Math.sin(phase) + wobbleY,
                        center.x - wobbleX * 0.5, center.y + radius
                    );
                    context.bezierCurveTo(
                        center.x - radius * 1.4, center.y + radius * 0.35,
                        center.x - radius * 0.8, center.y - radius * 0.85,
                        center.x + wobbleX, center.y - radius
                    );
                    context.fill();

                    if (index > 0 && index % 2 === 0) {
                        const previous = centers[index - 1];
                        const bend = (random() - 0.5) * 160 * scale;
                        context.globalCompositeOperation = "screen";
                        context.strokeStyle = colorFor(hue + 115, saturation, lightness + 20, preview ? 0.13 : 0.075);
                        context.lineWidth = (0.65 + random() * 1.8) * scale;
                        context.beginPath();
                        context.moveTo(previous.x, previous.y);
                        context.bezierCurveTo(
                            previous.x + bend, previous.y - bend,
                            center.x - bend, center.y + bend,
                            center.x, center.y
                        );
                        context.stroke();
                    }
                });

                context.restore();
                context.globalCompositeOperation = "source-over";
            }

            function applyPalette() {
                palette = {
                    hue: Number(hueControl.value),
                    saturation: Number(saturationControl.value),
                    lightness: Number(lightnessControl.value)
                };
                updatePaletteControls();
                drawArtwork(trackingData, capturing);
            }

            function rotatePalette() {
                palette.hue = (palette.hue + 47) % 360;
                palette.saturation = palette.saturation >= 145 ? 70 : palette.saturation + 15;
                palette.lightness = palette.lightness >= 20 ? -20 : palette.lightness + 10;
                hueControl.value = String(palette.hue);
                saturationControl.value = String(palette.saturation);
                lightnessControl.value = String(palette.lightness);
                updatePaletteControls();
                drawArtwork(trackingData, capturing);
                setStatus("Palette shifted. Fine-tune hue, saturation, and lightness with the sliders.");
            }

            function downloadArtwork() {
                try {
                    const link = document.createElement("a");
                    link.download = "computational-background.png";
                    link.href = canvas.toDataURL("image/png");
                    link.hidden = true;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setStatus("Your 3840 × 2160 wallpaper download has started.");
                } catch (error) {
                    setStatus(`Could not export the wallpaper: ${error.message}`);
                }
            }

            window.addEventListener("pointermove", event => {
                latestPosition = {
                    x: event.clientX / Math.max(window.innerWidth, 1),
                    y: event.clientY / Math.max(window.innerHeight, 1)
                };
            }, { passive: true });

            startButton.addEventListener("click", beginCapture);
            stopButton.addEventListener("click", () => finishCapture("Capture stopped. Your artwork is ready to adjust or download."));
            downloadButton.addEventListener("click", downloadArtwork);
            paletteButton.addEventListener("click", rotatePalette);
            hueControl.addEventListener("input", applyPalette);
            saturationControl.addEventListener("input", applyPalette);
            lightnessControl.addEventListener("input", applyPalette);

            updatePaletteControls();
            updateSession();
            drawArtwork(trackingData, false);
        })();
    </script>
</body>
</html>
